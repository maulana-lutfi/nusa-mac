name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # untuk membuat GitHub Release saat push tag v*

jobs:
  # Tes di Linux (murah); runner macOS memakai kuota menit 10x lipat di repo privat.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo check --features macos-check

  dmg:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build Nusa.app + DMG (universal)
        run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nusa-macOS
          path: dist/*.dmg
      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
